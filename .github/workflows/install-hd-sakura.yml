name: Install HD cherry blossom overlay

on:
  push:
    paths:
      - '.github/workflows/install-hd-sakura.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the approved high-resolution artwork
        shell: python
        run: |
          import base64
          import pathlib
          import re

          data_path = pathlib.Path('.github/sakura-installer-data.txt')
          source = data_path.read_text(encoding='utf-8')
          match = re.search(
              r'encoded\s*=\s*\((.*?)\)\s*asset_path',
              source,
              re.S,
          )
          if not match:
              raise SystemExit('Could not locate the encoded artwork data')

          parts = re.findall(r'"([A-Za-z0-9+/=]+)"', match.group(1))
          encoded = ''.join(parts)
          artwork = base64.b64decode(encoded, validate=True)
          if len(artwork) < 500000 or not artwork.startswith(b'RIFF') or b'WEBP' not in artwork[:16]:
              raise SystemExit('Decoded artwork did not pass validation')

          asset_path = pathlib.Path('assets/sakura-overlay.webp')
          asset_path.parent.mkdir(parents=True, exist_ok=True)
          asset_path.write_bytes(artwork)

          css_path = pathlib.Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(\.sakura-corner\s*\{.*?background-image:\s*)url\("[^"]+"\);',
              re.S,
          )
          css, count = pattern.subn(
              r'\1url("assets/sakura-overlay.webp");',
              css,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not find the sakura background-image rule')

          css = css.replace('\n  image-rendering: auto;', '', 1)
          marker = '/* HD sakura sizing overrides */'
          if marker in css:
              css = css[:css.index(marker)].rstrip() + '\n'

          css += r'''

/* HD sakura sizing overrides */
.sakura-corner {
  top: -72px;
  right: -92px;
  width: 430px;
  height: 574px;
  opacity: 0.68;
  background-position: top right;
  background-size: contain;
  background-repeat: no-repeat;
}

@media (max-width: 860px) {
  .sakura-corner {
    top: -58px;
    right: -102px;
    width: 350px;
    height: 467px;
    opacity: 0.56;
  }
}

@media (max-width: 620px) {
  .sakura-corner {
    top: -42px;
    right: -112px;
    width: 255px;
    height: 340px;
    opacity: 0.42;
  }
}
'''
          css_path.write_text(css, encoding='utf-8')

          data_path.unlink()
          pathlib.Path('.github/workflows/install-hd-sakura.yml').unlink()

      - name: Commit the installed asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install approved high-resolution cherry blossom overlay"
          git push
