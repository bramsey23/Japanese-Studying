name: Restore approved sakura overlay

on:
  push:
    paths:
      - '.github/workflows/restore-approved-sakura.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the exact approved overlay without reverting other styles
        shell: python
        run: |
          import pathlib
          import re
          import subprocess

          approved_commit = "229669e49f1541bf3f498b4970f6f88e4aa0e81f"
          old_css = subprocess.check_output(
              ["git", "show", f"{approved_commit}:styles.css"],
              text=True,
          )
          match = re.search(
              r'background-image:\s*url\("(data:image/webp;base64,[^"]+)"\);',
              old_css,
          )
          if not match:
              raise SystemExit("Approved overlay data URI was not found")

          approved_url = match.group(1)
          path = pathlib.Path("styles.css")
          css = path.read_text()

          css, count = re.subn(
              r'background-image:\s*url\("[^"]+"\);',
              f'background-image: url("{approved_url}");',
              css,
              count=1,
          )
          if count != 1:
              raise SystemExit("Current sakura image URL was not replaced")

          css, desktop_count = re.subn(
              r'(\.sakura-corner \{\n  position: absolute;\n)'
              r'  top: [^;]+;\n  right: [^;]+;\n  width: [^;]+;\n  height: [^;]+;\n',
              r'\1  top: -72px;\n  right: -92px;\n  width: 390px;\n  height: 521px;\n',
              css,
              count=1,
          )
          if desktop_count != 1:
              raise SystemExit("Desktop sakura sizing block was not updated")

          css, tablet_count = re.subn(
              r'(@media \(max-width: 860px\) \{\n  \.sakura-corner \{\n)'
              r'    top: [^;]+;\n    right: [^;]+;\n    width: [^;]+;\n    height: [^;]+;\n',
              r'\1    top: -58px;\n    right: -102px;\n    width: 320px;\n    height: 427px;\n',
              css,
              count=1,
          )
          if tablet_count != 1:
              raise SystemExit("Tablet sakura sizing block was not updated")

          css, mobile_count = re.subn(
              r'(@media \(max-width: 620px\) \{\n  \.sakura-corner \{\n)'
              r'    top: [^;]+;\n    right: [^;]+;\n    width: [^;]+;\n    height: [^;]+;\n',
              r'\1    top: -42px;\n    right: -112px;\n    width: 235px;\n    height: 314px;\n',
              css,
              count=1,
          )
          if mobile_count != 1:
              raise SystemExit("Mobile sakura sizing block was not updated")

          css = css.replace("\n  image-rendering: auto;", "", 1)
          path.write_text(css)

          pathlib.Path(".github/workflows/restore-approved-sakura.yml").unlink()

      - name: Commit restored artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css .github/workflows/restore-approved-sakura.yml
          git commit -m "Restore approved cherry blossom overlay"
          git push
